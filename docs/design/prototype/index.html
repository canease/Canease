
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberHelp</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #243247;
}

header {
  background: #173b68;
  color: white;
  padding: 24px;
  text-align: center;
}

header h1 { margin: 0 0 8px; }

main {
  max-width: 750px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000012;
}

h2 { color: #173b68; }

button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #cbd6e2;
  border-radius: 8px;
  background: #f8fbff;
  color: #173b68;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

button:hover { background: #e5effb; }

.back {
  width: auto;
  padding: 10px 15px;
  background: #e8edf4;
}

.steps {
  padding: 15px 20px;
  background: #eef6f0;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #64748b;
  padding: 20px;
}
</style>
</head>
<body>

<header>
  <h1>CyberHelp</h1>
  <p>Simple help for common cybersecurity problems</p>
</header>

<main id="app">
  <h2>How can we help you?</h2>
  <p>Choose a category to find information about your problem.</p>

  <button onclick="showCategory('scams')">
    Scams & Phishing — Suspicious emails, texts, and links
  </button>

  <button onclick="showCategory('accounts')">
    Account Security — Passwords and hacked accounts
  </button>

  <button onclick="showCategory('computer')">
    Computer Problems — Common device and software issues
  </button>
</main>

<footer>CyberHelp | A student project</footer>

<script>
const topics = {
  scams: {
    title: "Scams & Phishing",
    description: "Learn how to recognize suspicious messages and links.",
    topics: [
      {
        title: "Phishing Emails",
        description: "Phishing emails try to trick you into sharing information, opening harmful attachments, or clicking unsafe links.",
        warnings: [
          "Unexpected messages asking for personal information",
          "Links to unfamiliar websites",
          "Urgent threats or offers that seem too good to be true",
          "A sender address that does not match the organization"
        ],
        steps: [
          "Do not click suspicious links or open unexpected attachments.",
          "Do not reply or provide passwords or financial information.",
          "Verify the message using the organization's official website or phone number.",
          "Report or delete the message if it is suspicious."
        ]
      }
    ]
  },
  accounts: {
    title: "Account Security",
    description: "Learn how to protect online accounts and respond to possible account theft.",
    topics: [
      {
        title: "Protecting Your Passwords",
        description: "Weak or reused passwords can make accounts easier to access without permission.",
        warnings: [
          "Login alerts you do not recognize",
          "Unexpected password reset emails",
          "The same password being used on several websites"
        ],
        steps: [
          "Use a long, unique password for each account.",
          "Use a reputable password manager if possible.",
          "Turn on multifactor authentication.",
          "Never share your password through an unexpected message."
        ]
      }
    ]
  },
  computer: {
    title: "Computer Problems",
    description: "Start with basic troubleshooting for common computer issues.",
    topics: [
      {
        title: "Suspicious Computer Activity",
        description: "Unexpected pop-ups, unfamiliar applications, or unusual behavior may need investigation.",
        warnings: [
          "Repeated unexpected pop-ups",
          "Unknown applications appearing",
          "Security warnings you did not expect"
        ],
        steps: [
          "Avoid clicking suspicious pop-ups or downloading suggested fixes.",
          "Run a scan with trusted, updated security software.",
          "Install available operating system and security updates.",
          "Ask a trusted technician for help if the problem continues."
        ]
      }
    ]
  }
};

function home() {
  document.getElementById("app").innerHTML = `
    <h2>How can we help you?</h2>
    <p>Choose a category to find information about your problem.</p>
    <button onclick="showCategory('scams')">Scams & Phishing — Suspicious emails, texts, and links</button>
    <button onclick="showCategory('accounts')">Account Security — Passwords and hacked accounts</button>
    <button onclick="showCategory('computer')">Computer Problems — Common device and software issues</button>
  `;
}

function showCategory(category) {
  const item = topics[category];

  document.getElementById("app").innerHTML = `
    <button class="back" onclick="home()">← Back to Home</button>
    <h2>${item.title}</h2>
    <p>${item.description}</p>
    ${item.topics.map((topic, index) => `
      <button onclick="showTopic('${category}', ${index})">
        ${topic.title} →
      </button>
    `).join("")}
  `;
}

function showTopic(category, index) {
  const topic = topics[category].topics[index];

  document.getElementById("app").innerHTML = `
    <button class="back" onclick="showCategory('${category}')">← Back to Categories</button>
    <h2>${topic.title}</h2>
    <p>${topic.description}</p>

    <h3>Warning Signs</h3>
    <ul>${topic.warnings.map(w => `<li>${w}</li>`).join("")}</ul>

    <h3>Recommended Steps</h3>
    <div class="steps">
      <ol>${topic.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    </div>

    <p><strong>Remember:</strong> If you are unsure, get help from a trusted professional or consult an official source.</p>
    <button class="back" onclick="showCategory('${category}')">← Back to Categories</button>
    <button class="back" onclick="home()">← Back to Home</button>
  `;
}
</script>

</body>
</html>
